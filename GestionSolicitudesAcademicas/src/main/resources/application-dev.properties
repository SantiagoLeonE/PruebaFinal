server.port=8080

spring.application.name=GestionSolicitudesAcademicas
spring.datasource.url=jdbc:postgresql://localhost:5432/gestionprueba
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.security.user.name=admin
#spring.security.user.password=admin123

app.jwt.secret=clave-supersecreta-para-la-gestion-de-solicitudes-academicas-uniquindio-2026-ingenieria-de-sistemas-y-computacion-pregrado
app.jwt.expiration-ms=86400000

#IA - Spring AI con Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.3
app.ia.habilitada=true

#CORS - permite que el frontend Angular consuma la API
app.cors.allowed-origins=http://localhost:4200