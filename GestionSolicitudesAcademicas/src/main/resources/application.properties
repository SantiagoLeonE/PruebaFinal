server.port=${PORT:8080}

spring.application.name=GestionSolicitudesAcademicas

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#MySQL
#spring.datasource.url=jdbc:mysql://localhost:3307/gestionprueba
#spring.datasource.username=root
#spring.datasource.password=sL112305

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.security.user.name=admin
#spring.security.user.password=admin123

#Nuevo
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

#IA - Spring AI con Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.3
app.ia.habilitada=false

#CORS - permite que el frontend Angular consuma la API
app.cors.allowed-origins=http://localhost:4200